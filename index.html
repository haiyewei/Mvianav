<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mvianav</title>
  <link rel="stylesheet" href="./src/material-custom.css">
  <link rel="stylesheet" href="./src/styles.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--md-sys-color-background, #f7f9fc);
      color: var(--md-sys-color-on-background, #1c1b1f);
    }

    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      max-width: 92%;
    }

    /* 响应式布局 */
    @media screen and (min-width: 1200px) {
      .container {
        width: 700px;
      }
    }

    @media screen and (max-width: 600px) {
      .container {
        width: 92%;
      }
    }
  </style>
  <script>
    // 在 DOM 加载之前立即检测并应用主题，防止闪烁
    (function() {
      const prefersDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (prefersDarkMode) {
        document.documentElement.classList.add('dark-theme');
        document.body.classList.add('dark-theme');
      } else {
        document.documentElement.classList.add('light-theme');
        document.body.classList.add('light-theme');
      }
      
      // 监听系统主题变化
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (e.matches) {
          document.documentElement.classList.remove('light-theme');
          document.documentElement.classList.add('dark-theme');
          document.body.classList.remove('light-theme');
          document.body.classList.add('dark-theme');
        } else {
          document.documentElement.classList.remove('dark-theme');
          document.documentElement.classList.add('light-theme');
          document.body.classList.remove('dark-theme');
          document.body.classList.add('light-theme');
        }
      });
    })();
  </script>
  <script type="module" src="./src/search-app.js"></script>
</head>
<body>
  <div class="container">
    <search-app></search-app>
  </div>
</body>
</html>
